<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff5f8f" />
  <title>Do You Love Me?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe4ec, #fff8fb);
      color: #3b1f2b;
    }
    .card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 95, 143, 0.2);
      border-radius: 28px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(91, 31, 53, 0.14);
    }
    .heart { font-size: 54px; margin-bottom: 8px; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 8vw, 40px); }
    p { line-height: 1.55; color: #6f4051; }
    input {
      width: 100%;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #efbfd0;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #ff5f8f; box-shadow: 0 0 0 3px rgba(255, 95, 143, 0.15); }
    .actions { display: flex; gap: 12px; margin-top: 18px; }
    button {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .primary { background: #ff5f8f; color: white; }
    .secondary { background: #f7e5ec; color: #6b2d43; }
    .hidden { display: none; }
    #message { margin-top: 18px; font-weight: 700; color: #9e3159; }
    .small { margin-top: 18px; font-size: 13px; opacity: .75; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>

    <section id="nameStep">
      <h1>Hey there ❤️</h1>
      <p>What is your name?</p>
      <input id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Your name" />
      <div class="actions">
        <button class="primary" id="continueBtn">Continue</button>
      </div>
    </section>

    <section id="loveStep" class="hidden">
      <h1 id="greeting">I have a question for you.</h1>
      <p>Do you love me?</p>
      <div class="actions">
        <button class="primary" id="yesBtn">Yes 💖</button>
        <button class="secondary" id="noBtn">No 🙈</button>
      </div>
      <div id="message" aria-live="polite"></div>
    </section>

    <p class="small">Made with ❤️</p>
  </main>

  <script>
    const nameStep = document.getElementById('nameStep');
    const loveStep = document.getElementById('loveStep');
    const nameInput = document.getElementById('nameInput');
    const greeting = document.getElementById('greeting');
    const message = document.getElementById('message');
    const noBtn = document.getElementById('noBtn');

    function startQuestion() {
      const name = nameInput.value.trim() || 'cutie';
      greeting.textContent = `Hello ${name}, I have a question for you.`;
      nameStep.classList.add('hidden');
      loveStep.classList.remove('hidden');
    }

    document.getElementById('continueBtn').addEventListener('click', startQuestion);
    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') startQuestion();
    });

    document.getElementById('yesBtn').addEventListener('click', () => {
      message.textContent = 'I love you my sweet big dhungi ❤️';
      noBtn.classList.add('hidden');
    });

    let noClicks = 0;
    noBtn.addEventListener('click', () => {
      noClicks += 1;
      if (noClicks === 1) {
        message.textContent = 'Shembade, khadoos, nay karat ka prem? Gap Yes var click kar 😌';
        noBtn.textContent = 'Nit vichar karun sang 😏';
      } else if (noClicks === 2) {
        message.textContent = 'Khota khota na 😄';
        noBtn.textContent = 'Are you sure? 🙈';
      } else {
        message.textContent = 'Mala mahitiye, majhi sweet booboo loves little dhungi. I love you my sweet big dhungi ❤️';
        noBtn.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
